<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Quiz Application</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><h1>Online Quiz Application</h1><p>Test your knowledge online</p></header>
<main class="container">
<section id="quiz" class="card"><h2 id="question">Loading...</h2><div id="options"></div><button id="nextBtn">Next Question</button><p id="progress"></p></section>
<section id="result" class="card hidden"><h2>Quiz Completed!</h2><p id="score"></p><button onclick="restartQuiz()">Try Again</button></section>
</main><footer>Online Quiz Application © 2026</footer>
<script src="js/script.js"></script>
</body></html>
